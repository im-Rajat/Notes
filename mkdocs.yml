site_name: Rajat's Notes
site_url: https://im-rajat.github.io/Notes/
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

# Scanning the root because you refused to make a docs folder
docs_dir: '.'

# Forcing the build folder entirely OUTSIDE the repository root to avoid the infinite loop error
site_dir: '../mkdocs_build_site'